<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#2f6feb">
<style>
  :root {
    --color-bg: #0f1115;
    --color-surface: #16181d;
    --color-surface-2: #1a1c22;
    --color-surface-hover: #21242c;
    --color-border: #2a2d34;
    --color-primary: #2f6feb;
    --color-primary-hover: #4a80f0;
    --color-primary-soft: rgba(47, 111, 235, 0.16);
    --color-text: #eee;
    --color-text-muted: #999;
    --color-text-faint: #666;
    --color-success: #6fdc8c;
    --color-warning: #dcb96f;
    --color-error: #dc6f6f;
    --color-info: #6fb8dc;
    --color-star: #e0c341;
    --color-star-soft: rgba(224, 195, 65, 0.16);

    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 999px;

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;

    --transition-fast: 120ms ease;
    --transition-normal: 200ms ease;

    --icon-size: 18px;
    --icon-size-sm: 14px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  svg { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.8s linear infinite; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 0;
    transition: background var(--transition-fast), border-color var(--transition-fast),
                color var(--transition-fast), transform var(--transition-fast);
  }
  .icon-btn svg { width: var(--icon-size); height: var(--icon-size); stroke: currentColor; }
  .icon-btn:hover:not(:disabled) { background: var(--color-surface-hover); color: var(--color-text); }
  .icon-btn:active:not(:disabled) { transform: scale(0.94); }
  .icon-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn.active {
    background: var(--color-primary-soft);
    border-color: var(--color-primary);
    color: var(--color-primary);
  }
  .icon-btn.destructive:hover:not(:disabled) {
    background: rgba(220, 111, 111, 0.14);
    border-color: var(--color-error);
    color: var(--color-error);
  }

  .icon-btn-sm {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-text-faint);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
  }
  .icon-btn-sm svg { width: var(--icon-size-sm); height: var(--icon-size-sm); stroke: currentColor; }
  .icon-btn-sm:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .icon-btn-sm:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .icon-btn-sm.active-pin { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary); }
  .icon-btn-sm.active-star { background: var(--color-star-soft); border-color: var(--color-star); color: var(--color-star); }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 38px;
    padding: 0 18px;
    border-radius: var(--radius-md);
    border: none;
    background: var(--color-primary);
    color: white;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition-fast), opacity var(--transition-fast);
  }
  .btn-primary svg { width: 16px; height: 16px; stroke: currentColor; }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
  .btn-primary:focus-visible { outline: 2px solid var(--color-primary-hover); outline-offset: 2px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    color: var(--color-text);
    font-size: 0.95em;
    cursor: pointer;
    text-align: left;
    transition: background var(--transition-fast);
  }
  .btn-secondary svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }
  .btn-secondary:hover { background: var(--color-surface-hover); }
  .btn-secondary:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

  #sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    transition: margin-left var(--transition-normal);
  }
  #sidebar.collapsed { margin-left: -260px; }
  #newChatBtn { margin: 12px; }
  #sessionList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 0.9em;
    color: #ccc;
    margin-bottom: 2px;
  }
  .session-item:hover { background: var(--color-surface-hover); }
  .session-item.active { background: #2a3550; color: white; }
  .session-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-action {
    opacity: 0;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--color-text-faint);
    flex-shrink: 0;
    transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
  }
  .session-action svg { width: 14px; height: 14px; stroke: currentColor; }
  .session-item:hover .session-action { opacity: 1; }
  .session-action:hover { background: var(--color-surface); color: var(--color-text); }
  .session-action.delete:hover { color: var(--color-error); }

  /* Conversation-level pin/star: section labels */
  .session-group-label {
    padding: 10px 12px 4px;
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--color-text-faint);
    text-transform: uppercase;
  }
  .session-action.persistent {
    opacity: 1;
  }
  .session-action.persistent.pin-active { color: var(--color-primary); }
  .session-action.persistent.star-active { color: var(--color-star); }

  /* Session status icons (non-interactive, always visible when active) */
  .session-status-icons {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .session-status-icons svg { width: 12px; height: 12px; stroke: currentColor; }
  .session-status-icons .status-pin { color: var(--color-primary); }
  .session-status-icons .status-star { color: var(--color-star); }

  /* Three-dot session menu */
  .session-menu-wrap { position: relative; flex-shrink: 0; }
  .session-menu-btn {
    opacity: 0;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--color-text-faint);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
  }
  .session-menu-btn svg { width: 15px; height: 15px; stroke: currentColor; }
  .session-item:hover .session-menu-btn,
  .session-menu-btn.menu-open { opacity: 1; }
  .session-menu-btn:hover, .session-menu-btn.menu-open { background: var(--color-surface); color: var(--color-text); }
  .session-menu-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }

  .session-menu-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    min-width: 168px;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 4px;
    z-index: 15;
  }
  .session-menu-dropdown.open { display: block; }
  .session-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    background: transparent;
    color: var(--color-text);
    font-size: 0.85em;
    text-align: left;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .session-menu-item svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }
  .session-menu-item:hover { background: var(--color-surface-hover); }
  .session-menu-item:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .session-menu-item.active-toggle { color: var(--color-primary); }
  .session-menu-divider { height: 1px; background: var(--color-border); margin: 4px 2px; }
  .session-menu-item.destructive { color: var(--color-error); }
  .session-menu-item.destructive:hover { background: rgba(220, 111, 111, 0.14); }

  .sidebar-footer-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border: none;
    border-top: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-text-muted);
    font-size: 0.9em;
    cursor: pointer;
    text-align: left;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .sidebar-footer-btn svg { width: 17px; height: 17px; stroke: currentColor; flex-shrink: 0; }
  .sidebar-footer-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
  .sidebar-footer-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }

  #settingsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
    align-items: center;
    justify-content: center;
  }
  #settingsOverlay.open { display: flex; }
  #settingsModal {
    width: 380px;
    max-width: calc(100vw - 32px);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 16px;
  }
  .settings-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 1.05em;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px;
    border-top: 1px solid var(--color-border);
  }
  .settings-row-label { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .settings-row-label svg { width: 18px; height: 18px; stroke: currentColor; color: var(--color-text-muted); flex-shrink: 0; }
  .settings-row-title { font-size: 0.92em; color: var(--color-text); }
  .settings-row-desc { font-size: 0.78em; color: var(--color-text-faint); margin-top: 2px; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  header {
    padding: 12px 16px;
    font-size: 1.1em;
    font-weight: bold;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #headerActions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #modeSelect {
    background: var(--color-surface-2);
    color: white;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px 10px;
    font-size: 0.85em;
    height: 38px;
    cursor: pointer;
  }
  #modeSelect:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

  /* Header three-dot menu */
  .header-menu-wrap { position: relative; flex-shrink: 0; }
  .header-menu-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 190px;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 4px;
    z-index: 25;
  }
  .header-menu-dropdown.open { display: block; }
  .header-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    background: transparent;
    color: var(--color-text);
    font-size: 0.88em;
    text-align: left;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .header-menu-item svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }
  .header-menu-item:hover { background: var(--color-surface-hover); }
  .header-menu-item:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
  .header-menu-item.active-toggle { color: var(--color-primary); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--color-text-faint);
    text-align: center;
    padding: 20px;
  }
  #emptyState h2 { color: #999; margin-bottom: 8px; font-weight: 600; }
  .example-chip {
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    margin: 6px;
    display: inline-block;
    cursor: pointer;
    font-size: 0.85em;
    color: #aaa;
    transition: background var(--transition-fast);
  }
  .example-chip:hover { background: var(--color-surface-hover); }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: var(--color-primary); color: white; }
  .assistant { align-self: flex-start; background: var(--color-surface-2); }
  .meta {
    font-size: 0.72em;
    opacity: 0.65;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mode-badge {
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85em;
  }
  .mode-high_confidence, .mode-broad_confidence { background: #1f4d2e; color: var(--color-success); }
  .mode-low_confidence { background: #4d3f1f; color: var(--color-warning); }
  .mode-no_local_answer { background: #4d1f1f; color: var(--color-error); }
  .mode-learned_from_internet { background: #1f3d4d; color: var(--color-info); }
  .mode-casual { background: var(--color-border); color: #999; }

  .msg-actions { margin-top: 6px; display: flex; gap: 6px; }

  .msg .md-content { white-space: normal; }
  .md-content p { margin: 0 0 0.6em; }
  .md-content p:last-child { margin-bottom: 0; }
  .md-content h1, .md-content h2, .md-content h3, .md-content h4 { margin: 0.6em 0 0.4em; line-height: 1.3; }
  .md-content h1:first-child, .md-content h2:first-child, .md-content h3:first-child { margin-top: 0; }
  .md-content ul, .md-content ol { margin: 0.3em 0 0.6em 1.3em; padding: 0; }
  .md-content li { margin: 0.2em 0; }
  .md-content code { background: var(--color-bg); padding: 2px 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .md-content pre { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 10px 12px; overflow-x: auto; margin: 0.5em 0; }
  .md-content pre code { background: none; padding: 0; }
  .md-content blockquote { border-left: 3px solid var(--color-border); margin: 0.5em 0; padding-left: 10px; color: var(--color-text-muted); }
  .md-content a { color: var(--color-info); text-decoration: underline; }
  .md-content strong { font-weight: 700; }

  #inputBar {
    display: flex;
    padding: 12px;
    border-top: 1px solid var(--color-border);
    gap: 8px;
    align-items: center;
  }
  #messageInput {
    flex: 1;
    height: 38px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    color: white;
    font-size: 1em;
  }
  #messageInput:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }

  #dashboardPanel, #starredPanel {
    display: none;
    position: absolute;
    top: 60px;
    right: 16px;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    z-index: 20;
  }
  #dashboardPanel { width: 360px; max-height: 500px; overflow-y: auto; padding: 16px; }
  #starredPanel { width: 320px; max-height: 400px; overflow-y: auto; padding: 12px; }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }
  .panel-header svg { width: 16px; height: 16px; stroke: currentColor; }

  #pinnedBar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--color-surface-2);
    border-bottom: 1px solid var(--color-border);
    font-size: 0.85em;
  }
  #pinnedBar svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

  @media (max-width: 700px) {
    #sidebar { position: absolute; z-index: 10; height: 100%; }
    #sidebar:not(.collapsed) { margin-left: 0; }
    #sidebar.collapsed { margin-left: -260px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <button id="newChatBtn" class="btn-secondary" aria-label="Start a new chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New chat
  </button>
  <div id="sessionList"></div>
  <button id="settingsBtn" class="sidebar-footer-btn" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
    <span>Settings</span>
  </button>
</div>

<div id="settingsOverlay">
  <div id="settingsModal" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-modal-header">
      <strong>Settings</strong>
      <button id="settingsCloseBtn" class="icon-btn" aria-label="Close settings" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <div>
          <div class="settings-row-title">Archived conversations</div>
          <div class="settings-row-desc" id="archivedRowDesc">View chats you've archived</div>
        </div>
      </div>
      <button id="archivedToggleBtn" class="icon-btn" aria-label="Toggle archived conversations" title="Toggle archived conversations"></button>
    </div>

    <div class="settings-row">
      <div class="settings-row-label">

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderInline(text) {
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  text = text.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
  return text;
}

function renderMarkdown(raw) {
  const lines = escapeHtml(raw).split("\n");
  let html = "", i = 0, inCodeBlock = false, codeBuffer = [];
  let listType = null, listBuffer = [], quoteBuffer = [];

  function flushList() {
    if (!listType) return;
    html += `<${listType}>` + listBuffer.map(li => `<li>${renderInline(li)}</li>`).join("") + `</${listType}>`;
    listType = null; listBuffer = [];
  }
  function flushQuote() {
    if (!quoteBuffer.length) return;
    html += `<blockquote>${quoteBuffer.map(renderInline).join("<br>")}</blockquote>`;
    quoteBuffer = [];
  }

  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)\s*$/);
    if (fence) {
      if (!inCodeBlock) { flushList(); flushQuote(); inCodeBlock = true; codeBuffer = []; }
      else { html += `<pre><code>${codeBuffer.join("\n")}</code></pre>`; inCodeBlock = false; }
      i++; continue;
    }
    if (inCodeBlock) { codeBuffer.push(line); i++; continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushList(); flushQuote(); const lvl = h[1].length; html += `<h${lvl}>${renderInline(h[2])}</h${lvl}>`; i++; continue; }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      flushQuote();
      const type = ul ? "ul" : "ol";
      if (listType && listType !== type) flushList();
      listType = type;
      listBuffer.push(ul ? ul[1] : ol[1]);
      i++; continue;
    } else { flushList(); }

    const bq = line.match(/^>\s?(.*)$/);
    if (bq) { quoteBuffer.push(bq[1]); i++; continue; } else { flushQuote(); }

    if (line.trim() === "") { i++; continue; }
    html += `<p>${renderInline(line)}</p>`;
    i++;
  }
  flushList(); flushQuote();
  if (inCodeBlock) html += `<pre><code>${codeBuffer.join("\n")}</code></pre>`;
  return html;
}

  sessionId = "mobile-" + Math.random().toString(36).slice(2);

let voiceEnabled = localStorage.getItem("nova_voice_enabled") === "true";

const headerVoiceItem = document.getElementById("headerVoiceItem");
const headerVoiceIconWrap = document.getElementById("headerVoiceIconWrap");

function updateHeaderVoiceItem() {
  headerVoiceIconWrap.innerHTML = voiceEnabled ? ICONS.volumeOn : ICONS.volumeOff;
  headerVoiceItem.classList.toggle("active-toggle", voiceEnabled);
}
updateHeaderVoiceItem();

headerVoiceItem.addEventListener("click", (e) => {
  e.stopPropagation();
  voiceEnabled = !voiceEnabled;
  localStorage.setItem("nova_voice_enabled", voiceEnabled);
  updateHeaderVoiceItem();
  if (!voiceEnabled) speechSynthesis.cancel();
});

const backupBtn = document.getElementById("backupBtn");

backupBtn.addEventListener("click", async () => {
  backupBtn.disabled = true;
  backupBtn.innerHTML = ICONS.spinner;
  try {
    const res = await fetch("/backup/create", { method: "POST" });
    if (!res.ok) throw new Error("Backup failed");
    const data = await res.json();
    backupBtn.innerHTML = ICONS.check;
    backupBtn.title = `Backed up: ${data.backup_name} (${data.size_mb} MB)`;
  } catch (err) {
    backupBtn.innerHTML = ICONS.alert;
    backupBtn.title = "Backup failed — check server logs";
  } finally {
    setTimeout(() => {
      backupBtn.innerHTML = ICONS.save;
      backupBtn.title = "Back up now";
      backupBtn.disabled = false;
    }, 2500);
  }
});

function speak(text) {
  if (!voiceEnabled || !text) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  speechSynthesis.speak(utterance);
}

const micBtn = document.getElementById("micBtn");
let recognition = null;
let isListening = false;

if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.addEventListener("result", (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    input.focus();
  });

  recognition.addEventListener("end", () => {
    isListening = false;
    micBtn.classList.remove("active");
    micBtn.innerHTML = ICONS.mic;
  });

  recognition.addEventListener("error", (event) => {
    isListening = false;
    micBtn.classList.remove("active");
    micBtn.innerHTML = ICONS.mic;
    console.error("Speech recognition error:", event.error);
  });

  micBtn.addEventListener("click", () => {
    if (isListening) {
      recognition.stop();
      return;
    }
    isListening = true;
    micBtn.classList.add("active");
    micBtn.innerHTML = ICONS.micActive;
    recognition.start();
  });
} else {
  micBtn.disabled = true;
  micBtn.title = "Speech recognition not supported in this browser";
}

function showChat(hasMessages) {
  chat.style.display = hasMessages ? "flex" : "none";
  emptyState.style.display = hasMessages ? "none" : "flex";
}

function mkIconBtn(iconSvg, title, onClick, extraClass) {
  const b = document.createElement("button");
  b.className = "icon-btn-sm" + (extraClass ? " " + extraClass : "");
  b.innerHTML = iconSvg;
  b.title = title;
  b.setAttribute("aria-label", title);
  b.addEventListener("click", onClick);
  return b;
}

function attachActions(div, role, text, userMsgId, assistantMsgId, initialPinned, initialStarred) {
  const msgId = role === "user" ? userMsgId : assistantMsgId;
  if (!msgId) return;

  const actions = document.createElement("div");
  actions.className = "msg-actions";

  actions.appendChild(mkIconBtn(ICONS.copy, "Copy", () => {
    navigator.clipboard.writeText(text);
  }));

  const pinBtn = mkIconBtn(ICONS.pin, "Pin/unpin", async () => {
    const isPinned = pinBtn.dataset.active === "true";
    await fetch(isPinned ? "/messages/unpin" : "/messages/pin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message_id: msgId }),
    });
    pinBtn.dataset.active = isPinned ? "false" : "true";
    pinBtn.classList.toggle("active-pin", !isPinned);
    loadPinned();
  });
  pinBtn.dataset.active = initialPinned ? "true" : "false";
  pinBtn.classList.toggle("active-pin", !!initialPinned);
  actions.appendChild(pinBtn);

  const starBtn = mkIconBtn(ICONS.star, "Star/unstar", async () => {
    const isStarred = starBtn.dataset.active === "true";
    await fetch(isStarred ? "/messages/unstar" : "/messages/star", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message_id: msgId }),
    });
    starBtn.dataset.active = isStarred ? "false" : "true";
    starBtn.classList.toggle("active-star", !isStarred);
    if (starredPanel.style.display === "block") {
      loadStarred();
    }
  });
  starBtn.dataset.active = initialStarred ? "true" : "false";
  starBtn.classList.toggle("active-star", !!initialStarred);
  actions.appendChild(starBtn);

  if (role === "user") {
    actions.appendChild(mkIconBtn(ICONS.edit, "Edit & retry", async () => {
      const newText = prompt("Edit your message:", text);
      if (!newText || newText === text) return;
      await fetch("/chat/retry", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message_id: msgId, new_message: newText }),
      });
      loadHistory(sessionId);
    }));
  }

  div.appendChild(actions);
}

function addMessage(text, role, meta, userQuestion, userMsgId, assistantMsgId, initialPinned, initialStarred) {
  const div = document.createElement("div");
  div.className = "msg " + role;

  const textDiv = document.createElement("div");
  if (role === "assistant") {
    textDiv.className = "md-content";
    textDiv.innerHTML = renderMarkdown(text);
  } else {
    textDiv.textContent = text;
  }
  div.appendChild(textDiv);

  const msgId = role === "user" ? userMsgId : assistantMsgId;

  if (meta) {
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    if (meta.mode) {
      const badge = document.createElement("span");
      badge.className = "mode-badge mode-" + meta.mode;
      badge.textContent = meta.mode.replace(/_/g, " ");
      metaDiv.appendChild(badge);
    }
    if (meta.sources && meta.sources.length) {
      const src = document.createElement("span");
      src.textContent = meta.sources.join(", ");
      metaDiv.appendChild(src);
    }
    div.appendChild(metaDiv);

    if (meta.filed_elsewhere) {
      const promptDiv = document.createElement("div");
      promptDiv.style.marginTop = "8px";
      const btn = document.createElement("button");
      btn.textContent = "Move to General chat";
      btn.style.cssText = "font-size:0.8em;padding:4px 10px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-surface-hover);color:#ccc;cursor:pointer;";
      btn.addEventListener("click", async () => {
        await fetch("/sessions/move_message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            target_session_id: GENERAL_SESSION_ID,
            user_message: userQuestion,
            assistant_message: text,
            source_user_message_id: userMsgId,
            source_assistant_message_id: assistantMsgId,
          }),
        });
        switchSession(GENERAL_SESSION_ID);
        loadSessions();
      });
      promptDiv.appendChild(btn);
      div.appendChild(promptDiv);
    }
  }

  if (msgId) {
    attachActions(div, role, text, userMsgId, assistantMsgId, initialPinned, initialStarred);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  showChat(true);
}

const dashboardPanel = document.getElementById("dashboardPanel");
const dashboardBody = document.getElementById("dashboardBody");

async function loadDashboard() {
  const res = await fetch("/knowledge/dashboard");
  const stats = await res.json();

  dashboardBody.innerHTML = "";

  const totalDiv = document.createElement("div");
  totalDiv.style.cssText = "font-size:1.8em;font-weight:700;margin:12px 0 4px;color:var(--color-success);";
  totalDiv.textContent = stats.total_chunks;
  dashboardBody.appendChild(totalDiv);

  const totalLabel = document.createElement("div");
  totalLabel.style.cssText = "font-size:0.8em;color:#888;margin-bottom:16px;";
  totalLabel.textContent = "things NOVA has learned";
  dashboardBody.appendChild(totalLabel);

  const confDiv = document.createElement("div");
  confDiv.style.cssText = "font-size:0.85em;color:#ccc;margin-bottom:16px;";
  const confPct = stats.average_confidence * 100;
  const confLabel = confPct >= 85 ? "Very confident" : confPct >= 65 ? "Fairly confident" : "Still learning";
  confDiv.textContent = `How sure NOVA is about what it knows: ${confLabel}`;
  dashboardBody.appendChild(confDiv);

  const tierLabels = { cache: "Recently learned", pinned: "Saved by you", pack: "Core knowledge" };
  const tierHeading = document.createElement("div");
  tierHeading.style.cssText = "font-weight:600;color:var(--color-info);margin-top:10px;";
  tierHeading.textContent = "What kind of knowledge";
  dashboardBody.appendChild(tierHeading);
  for (const [tier, count] of Object.entries(stats.by_tier)) {
    const row = document.createElement("div");
    row.style.cssText = "font-size:0.82em;color:#ccc;display:flex;justify-content:space-between;padding:3px 0;";
    row.innerHTML = `<span>${tierLabels[tier] || tier}</span><span>${count}</span>`;
    dashboardBody.appendChild(row);
  }

  const catHeading = document.createElement("div");
  catHeading.style.cssText = "font-weight:600;color:var(--color-info);margin-top:12px;";
  catHeading.textContent = "By category";
  dashboardBody.appendChild(catHeading);
  const sortedCats = Object.entries(stats.by_category).sort((a, b) => b[1] - a[1]);
  for (const [cat, count] of sortedCats) {
    const row = document.createElement("div");
    row.style.cssText = "font-size:0.82em;color:#ccc;display:flex;justify-content:space-between;padding:3px 0;";
    row.innerHTML = `<span>${cat.replace(/_/g, " ")}</span><span>${count}</span>`;
    dashboardBody.appendChild(row);
  }

  const growthHeading = document.createElement("div");
  growthHeading.style.cssText = "font-weight:600;color:var(--color-info);margin-top:12px;";
  growthHeading.textContent = "Learning activity this week";
  dashboardBody.appendChild(growthHeading);

  const chartDiv = document.createElement("div");
  chartDiv.style.cssText = "display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:8px;";
  const growthEntries = Object.entries(stats.growth_last_14_days);
  const maxCount = Math.max(...growthEntries.map(([, c]) => c), 1);
  for (const [day, count] of growthEntries) {
    const bar = document.createElement("div");
    const heightPct = (count / maxCount) * 100;
    bar.style.cssText = `flex:1;background:var(--color-primary);border-radius:2px 2px 0 0;height:${heightPct}%;min-height:2px;`;
    const friendlyDate = new Date(day).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    bar.title = `${friendlyDate}: learned ${count} new thing${count === 1 ? '' : 's'}`;
    chartDiv.appendChild(bar);
  }
  dashboardBody.appendChild(chartDiv);
}

document.getElementById("dashboardBtn").addEventListener("click", async () => {
  const isVisible = dashboardPanel.style.display === "block";
  if (isVisible) {
    dashboardPanel.style.display = "none";
  } else {
    await loadDashboard();
    dashboardPanel.style.display = "block";
  }
});

let starredData = null;

async function loadStarred() {
  const res = await fetch("/starred");
  starredData = (await res.json()).starred_by_mode;
  renderStarredPanel();
}

function renderStarredPanel() {
  starredBody.innerHTML = "";

  const modes = Object.keys(starredData);
  if (!modes.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "color:#666;margin-top:10px;";
    empty.textContent = "Nothing starred yet.";
    starredBody.appendChild(empty);
    return;
  }

  const filterSelect = document.createElement("select");
  filterSelect.style.cssText = "margin-top:10px;width:100%;background:var(--color-bg);color:white;border:1px solid var(--color-border);border-radius:6px;padding:6px;";
  const allOpt = document.createElement("option");
  allOpt.value = "__all__";
  allOpt.textContent = "All modes";
  filterSelect.appendChild(allOpt);
  for (const mode of modes) {
    const opt = document.createElement("option");
    opt.value = mode;
    opt.textContent = mode === "general" ? "General" : mode.replace(/_/g, " ");
    filterSelect.appendChild(opt);
  }
  filterSelect.addEventListener("change", () => renderStarredResults(filterSelect.value));
  starredBody.appendChild(filterSelect);

  const resultsDiv = document.createElement("div");
  resultsDiv.id = "starredResults";
  resultsDiv.style.marginTop = "10px";
  starredBody.appendChild(resultsDiv);

  renderStarredResults("__all__");
}

function renderStarredResults(filterMode) {
  const resultsDiv = document.getElementById("starredResults");
  resultsDiv.innerHTML = "";

  const modesToShow = filterMode === "__all__" ? Object.keys(starredData) : [filterMode];

  for (const mode of modesToShow) {
    const heading = document.createElement("div");
    heading.style.cssText = "font-weight:600;margin-top:10px;color:var(--color-info);";
    heading.textContent = mode === "general" ? "General" : mode.replace(/_/g, " ");
    resultsDiv.appendChild(heading);

    for (const msg of starredData[mode]) {
      const item = document.createElement("div");
      item.style.cssText = "font-size:0.85em;color:#ccc;padding:6px 0;border-bottom:1px solid var(--color-border);cursor:pointer;";
      item.textContent = msg.content.slice(0, 80) + (msg.content.length > 80 ? "..." : "");
      item.addEventListener("click", () => {
        switchSession(msg.session_id);
        starredPanel.style.display = "none";
      });
      resultsDiv.appendChild(item);
    }
  }
}

async function sendMessage(text) {
  text = (text || input.value).trim();
  if (!text) return;

  addMessage(text, "user");
  const userDiv = chat.lastElementChild;
  input.value = "";
  sendBtn.disabled = true;

  const assistantDiv = document.createElement("div");
  assistantDiv.className = "msg assistant";
  const assistantTextDiv = document.createElement("div");
  assistantTextDiv.textContent = "thinking...";
  assistantTextDiv.style.opacity = "0.6";
  assistantDiv.appendChild(assistantTextDiv);
  chat.appendChild(assistantDiv);
  chat.scrollTop = chat.scrollHeight;
  showChat(true);

  let fullText = "";

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === "chunk") {
          if (fullText === "") {
            assistantTextDiv.style.opacity = "1";
          }
          fullText += event.text;
          assistantTextDiv.textContent = fullText;
          chat.scrollTop = chat.scrollHeight;
        } else if (event.type === "done") {
          assistantTextDiv.className = "md-content";
          assistantTextDiv.innerHTML = renderMarkdown(fullText);
          attachActions(userDiv, "user", text, event.user_message_id, event.user_message_id);

          const metaDiv = document.createElement("div");
          metaDiv.className = "meta";
          const badge = document.createElement("span");
          badge.className = "mode-badge mode-" + event.mode;
          badge.textContent = event.mode.replace(/_/g, " ");
          metaDiv.appendChild(badge);
          if (event.sources && event.sources.length) {
            const src = document.createElement("span");
            src.textContent = event.sources.join(", ");
            metaDiv.appendChild(src);
          }
          assistantDiv.appendChild(metaDiv);

          if (event.filed_elsewhere) {
            const moveBtn = document.createElement("button");
            moveBtn.textContent = "Move to General chat";
            moveBtn.style.cssText = "margin-top:8px;font-size:0.8em;padding:4px 10px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-surface-hover);color:#ccc;cursor:pointer;display:block;";
            moveBtn.addEventListener("click", async () => {
              await fetch("/sessions/move_message", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  target_session_id: GENERAL_SESSION_ID,
                  user_message: text, assistant_message: fullText,
                  source_user_message_id: event.user_message_id,
                  source_assistant_message_id: event.assistant_message_id,
                }),
              });
              switchSession(GENERAL_SESSION_ID);
              loadSessions();
            });
            assistantDiv.appendChild(moveBtn);
          }

          attachActions(assistantDiv, "assistant", fullText, event.user_message_id, event.assistant_message_id);
          speak(fullText);
          loadSessions();
        }
      }
    }
  } catch (err) {
    assistantTextDiv.textContent = "Error: could not reach NOVA. " + err;
  } finally {
    sendBtn.disabled = false;
  }
}

const pinnedBar = document.getElementById("pinnedBar");
const pinnedItems = document.getElementById("pinnedItems");

async function loadPinned() {
  try {
    const res = await fetch("/sessions/" + sessionId + "/pinned");
    const data = await res.json();
    if (!data.pinned.length) {
      pinnedBar.style.display = "none";
      return;
    }
    pinnedItems.innerHTML = "";
    data.pinned.forEach((m) => {
      const span = document.createElement("span");
      span.textContent = m.content.slice(0, 60) + (m.content.length > 60 ? "..." : "");
      span.style.cssText = "color:#aaa;white-space:nowrap;";
      pinnedItems.appendChild(span);
    });
    pinnedBar.style.display = "flex";
  } catch (err) {
    pinnedBar.style.display = "none";
  }
}

async function loadHistory(id) {
  chat.innerHTML = "";
  try {
    const res = await fetch("/history/" + id);
    if (!res.ok) { showChat(false); return; }
    const data = await res.json();
    if (!data.messages.length) { showChat(false); return; }
    for (const msg of data.messages) {
      const msgUserId = msg.role === "user" ? msg.id : undefined;
      const assistantId = msg.role === "assistant" ? msg.id : undefined;
      addMessage(msg.content, msg.role, null, null, msgUserId, assistantId, !!msg.pinned, !!msg.starred);
    }
  } catch (err) {
    showChat(false);
  }
}

function closeAllSessionMenus() {
  document.querySelectorAll(".session-menu-dropdown.open").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".session-menu-btn.menu-open").forEach(el => el.classList.remove("menu-open"));
}

function mkSessionMenuItem(iconSvg, label, onClick, extraClass) {
  const btn = document.createElement("button");
  btn.className = "session-menu-item" + (extraClass ? " " + extraClass : "");
  btn.innerHTML = iconSvg + `<span>${label}</span>`;
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    closeAllSessionMenus();
    await onClick();
  });
  return btn;
}

function createSessionItem(s) {
  const item = document.createElement("div");
  item.className = "session-item" + (s.session_id === sessionId ? " active" : "");

  const title = document.createElement("div");
  title.className = "session-title";
  title.textContent = s.title;
  title.addEventListener("click", () => switchSession(s.session_id));

  const statusIcons = document.createElement("div");
  statusIcons.className = "session-status-icons";
  if (s.pinned) {
    const pinIcon = document.createElement("span");
    pinIcon.className = "status-pin";
    pinIcon.innerHTML = ICONS.pin;
    pinIcon.title = "Pinned";
    statusIcons.appendChild(pinIcon);
  }
  if (s.starred) {
    const starIcon = document.createElement("span");
    starIcon.className = "status-star";
    starIcon.innerHTML = ICONS.star;
    starIcon.title = "Starred";
    statusIcons.appendChild(starIcon);
  }

  const menuWrap = document.createElement("div");
  menuWrap.className = "session-menu-wrap";

  const menuBtn = document.createElement("button");
  menuBtn.className = "session-menu-btn";
  menuBtn.innerHTML = ICONS.more;
  menuBtn.title = "More options";
  menuBtn.setAttribute("aria-label", "More options for " + s.title);
  menuBtn.setAttribute("aria-haspopup", "true");

  const dropdown = document.createElement("div");
  dropdown.className = "session-menu-dropdown";
  dropdown.setAttribute("role", "menu");

  dropdown.appendChild(mkSessionMenuItem(
    ICONS.pin, s.pinned ? "Unpin conversation" : "Pin conversation",
    async () => {
      await fetch("/sessions/" + s.session_id + "/pin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned: !s.pinned }),
      });
      loadSessions();
    },
    s.pinned ? "active-toggle" : ""
  ));

  dropdown.appendChild(mkSessionMenuItem(
    ICONS.star, s.starred ? "Unstar conversation" : "Star conversation",
    async () => {
      await fetch("/sessions/" + s.session_id + "/star", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ starred: !s.starred }),
      });
      loadSessions();
    },
    s.starred ? "active-toggle" : ""
  ));

  const divider1 = document.createElement("div");
  divider1.className = "session-menu-divider";
  dropdown.appendChild(divider1);

  dropdown.appendChild(mkSessionMenuItem(
    s.archived ? ICONS.undo : ICONS.archive, s.archived ? "Unarchive" : "Archive",
    async () => {
      await fetch("/sessions/" + s.session_id + "/archive", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ archived: !s.archived }),
      });
      if (s.session_id === sessionId && !s.archived) startNewChat();
      loadSessions();
    }
  ));

  const divider2 = document.createElement("div");
  divider2.className = "session-menu-divider";
  dropdown.appendChild(divider2);

  dropdown.appendChild(mkSessionMenuItem(
    ICONS.trash, "Delete conversation",
    async () => {
      const confirmed = confirm("Delete this conversation? This can't be undone.");
      if (!confirmed) return;
      await fetch("/sessions/" + s.session_id, { method: "DELETE" });
      if (s.session_id === sessionId) startNewChat();
      loadSessions();
    },
    "destructive"
  ));

  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains("open");
    closeAllSessionMenus();
    if (!isOpen) {
      dropdown.classList.add("open");
      menuBtn.classList.add("menu-open");
    }
  });

  menuWrap.appendChild(menuBtn);
  menuWrap.appendChild(dropdown);

  item.appendChild(title);
  item.appendChild(statusIcons);
  item.appendChild(menuWrap);
  return item;
}

function renderSessionGroup(sessions, label) {
  if (!sessions.length) return;
  if (label) {
    const header = document.createElement("div");
    header.className = "session-group-label";
    header.textContent = label;
    sessionList.appendChild(header);
  }
  for (const s of sessions) {
    sessionList.appendChild(createSessionItem(s));
  }
}

let showArchived = false;

async function loadSessions() {
  try {
    const url = showArchived ? "/sessions?include_archived=true" : "/sessions";
    const res = await fetch(url);
    const data = await res.json();
    sessionList.innerHTML = "";

    const visibleSessions = showArchived
      ? data.sessions.filter(s => s.archived)
      : data.sessions.filter(s => !s.archived);

    if (showArchived) {
      renderSessionGroup(visibleSessions, null);
      return;
    }

    const pinned = visibleSessions.filter(s => s.pinned);
    const starred = visibleSessions.filter(s => s.starred && !s.pinned);
    const recent = visibleSessions.filter(s => !s.pinned && !s.starred);

    renderSessionGroup(pinned, pinned.length ? "Pinned" : null);
    renderSessionGroup(starred, starred.length ? "Starred" : null);
    renderSessionGroup(recent, recent.length ? "Recent" : null);
  } catch (err) {
    console.error("Could not load sessions:", err);
  }
}

const archivedToggleBtn = document.getElementById("archivedToggleBtn");
const archivedRowDesc = document.getElementById("archivedRowDesc");

function updateArchivedSettingsRow() {
  archivedToggleBtn.innerHTML = showArchived ? ICONS.undo : ICONS.archive;
  archivedToggleBtn.title = showArchived ? "Show active conversations" : "Show archived conversations";
  archivedRowDesc.textContent = showArchived
    ? "Currently viewing archived chats — tap to go back"
    : "View chats you've archived";
}
updateArchivedSettingsRow();

archivedToggleBtn.addEventListener("click", () => {
  showArchived = !showArchived;
  updateArchivedSettingsRow();
  loadSessions();
  closeSettings();
});

async function loadModes() {
  const res = await fetch("/modes");
  const data = await res.json();
  modeSelect.innerHTML = "";
  for (const m of data.modes) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m === "general" ? "General" : m.replace(/_/g, " ");
    modeSelect.appendChild(opt);
  }
  syncModeSelect();
}

async function syncModeSelect() {
  const res = await fetch("/sessions");
  const data = await res.json();
  const current = data.sessions.find(s => s.session_id === sessionId);
  modeSelect.value = current ? current.mode : "general";
}

modeSelect.addEventListener("change", async () => {
  await fetch("/sessions/" + sessionId + "/mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: modeSelect.value }),
  });
  loadSessions();
});

document.getElementById("newModeBtn").addEventListener("click", async () => {
  const name = prompt("Name this mode (e.g. 'cooking', 'personal_finance'):");
  if (!name) return;
  const normalized = name.trim().toLowerCase().replace(/\s+/g, "_");
  if (!normalized) return;

  await fetch("/sessions/" + sessionId + "/mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: normalized }),
  });
  await loadModes();
  modeSelect.value = normalized;
  loadSessions();
});

function switchSession(id) {
  sessionId = id;
  localStorage.setItem("nova_session_id", sessionId);
  loadHistory(sessionId);
  loadSessions();
  syncModeSelect();
  loadPinned();
}

function startNewChat() {
  sessionId = "mobile-" + Math.random().toString(36).slice(2);
  localStorage.setItem("nova_session_id", sessionId);
  chat.innerHTML = "";
  showChat(false);
  syncModeSelect();
  loadSessions();
}

attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  addMessage(`Uploading "${file.name}"...`, "user");

  const formData = new FormData();
  formData.append("file", file);
  formData.append("tags", "chat-upload");
  formData.append("confidence", "1.0");

  const currentModeRes = await fetch("/sessions");
  const sessionsData = await currentModeRes.json();
  const current = sessionsData.sessions.find(s => s.session_id === sessionId);
  const mode = current ? current.mode : "general";
  formData.append("categories", mode);

  try {
    const res = await fetch("/knowledge/ingest_document", {
      method: "POST",
      body: formData,
    });
    const data = await res.json();
    addMessage(
      `"${file.name}" processed: ${data.chunks_stored} chunks stored` +
      (data.chunks_skipped_as_duplicate ? `, ${data.chunks_skipped_as_duplicate} skipped as duplicate` : "") +
      `. Ask me anything about it!`,
      "assistant"
    );
  } catch (err) {
    addMessage("Error uploading file: " + err, "assistant");
  }

  fileInput.value = "";
});

const settingsBtn = document.getElementById("settingsBtn");
const settingsOverlay = document.getElementById("settingsOverlay");
const settingsCloseBtn = document.getElementById("settingsCloseBtn");

function openSettings() {
  settingsOverlay.classList.add("open");
  settingsCloseBtn.focus();
}
function closeSettings() {
  settingsOverlay.classList.remove("open");
  settingsBtn.focus();
}

settingsBtn.addEventListener("click", openSettings);
settingsCloseBtn.addEventListener("click", closeSettings);
settingsOverlay.addEventListener("click", (e) => {
  if (e.target === settingsOverlay) closeSettings();
});

const headerMenuBtn = document.getElementById("headerMenuBtn");
const headerMenuDropdown = document.getElementById("headerMenuDropdown");
const headerStarredItem = document.getElementById("headerStarredItem");

function closeHeaderMenu() {
  headerMenuDropdown.classList.remove("open");
  headerMenuBtn.classList.remove("menu-open");
}

headerMenuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const isOpen = headerMenuDropdown.classList.contains("open");
  closeAllSessionMenus();
  closeHeaderMenu();
  if (!isOpen) {
    headerMenuDropdown.classList.add("open");
    headerMenuBtn.classList.add("menu-open");
  }
});

headerStarredItem.addEventListener("click", async (e) => {
  e.stopPropagation();
  closeHeaderMenu();
  const isVisible = starredPanel.style.display === "block";
  if (isVisible) {
    starredPanel.style.display = "none";
  } else {
    await loadStarred();
    starredPanel.style.display = "block";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && settingsOverlay.classList.contains("open")) closeSettings();
  if (e.key === "Escape") { closeAllSessionMenus(); closeHeaderMenu(); }
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".session-menu-wrap")) closeAllSessionMenus();
  if (!e.target.closest(".header-menu-wrap")) closeHeaderMenu();
});

newChatBtn.addEventListener("click", startNewChat);
sendBtn.addEventListener("click", () => sendMessage());
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
document.getElementById("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("collapsed"));

document.querySelectorAll(".example-chip").forEach(chip => {
  chip.addEventListener("click", () => sendMessage(chip.dataset.q));
});

async function init() {
  await loadModes();
  await loadHistory(sessionId);
  await loadSessions();
  await loadPinned();
}
init();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js")
    .then(() => console.log("Service worker registered"))
    .catch((err) => console.error("Service worker registration failed:", err));
}
</script>
