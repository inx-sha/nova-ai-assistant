<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: #16181d;
    border-right: 1px solid #2a2d34;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed { margin-left: -260px; }
  #newChatBtn {
    margin: 12px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: white;
    font-size: 0.95em;
    cursor: pointer;
    text-align: left;
  }
  #newChatBtn:hover { background: #21242c; }
  #sessionList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    color: #ccc;
    margin-bottom: 2px;
  }
  .session-item:hover { background: #1e2128; }
  .session-item.active { background: #2a3550; color: white; }
  .session-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-delete {
    opacity: 0;
    color: #888;
    font-size: 1.1em;
    padding: 2px 6px;
  }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: #ff6b6b; }

  /* Main chat area */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    padding: 14px 16px;
    font-size: 1.1em;
    font-weight: bold;
    border-bottom: 1px solid #2a2d34;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #sidebarToggle {
    background: none;
    border: 1px solid #2a2d34;
    color: #ccc;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #666;
    text-align: center;
    padding: 20px;
  }
  #emptyState h2 { color: #999; margin-bottom: 8px; }
  .example-chip {
    background: #1a1c22;
    border: 1px solid #2a2d34;
    border-radius: 20px;
    padding: 8px 16px;
    margin: 6px;
    display: inline-block;
    cursor: pointer;
    font-size: 0.85em;
    color: #aaa;
  }
  .example-chip:hover { background: #21242c; }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2f6feb; color: white; }
  .assistant { align-self: flex-start; background: #1e2128; }
  .meta {
    font-size: 0.72em;
    opacity: 0.65;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mode-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85em;
  }
  .mode-high_confidence, .mode-broad_confidence { background: #1f4d2e; color: #6fdc8c; }
  .mode-low_confidence { background: #4d3f1f; color: #dcb96f; }
  .mode-no_local_answer { background: #4d1f1f; color: #dc6f6f; }
  .mode-learned_from_internet { background: #1f3d4d; color: #6fb8dc; }
  .mode-casual { background: #2a2d34; color: #999; }

  #inputBar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #2a2d34;
    gap: 8px;
  }
  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: white;
    font-size: 1em;
  }
  #sendBtn {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2f6feb;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; }

  @media (max-width: 700px) {
    #sidebar { position: absolute; z-index: 10; height: 100%; }
    #sidebar:not(.collapsed) { margin-left: 0; }
    #sidebar.collapsed { margin-left: -260px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <button id="newChatBtn">+ New chat</button>
  <div id="sessionList"></div>
  <div id="archivedToggle" style="padding:10px 16px;font-size:0.8em;color:#666;cursor:pointer;border-top:1px solid #2a2d34;">Show archived</div>
</div>

<div id="main">
  <header>
    <button id="sidebarToggle">☰</button>
    NOVA
    <select id="modeSelect" style="margin-left:auto;background:#1a1c22;color:white;border:1px solid #2a2d34;border-radius:6px;padding:6px;"></select>
<button id="newModeBtn" style="margin-left:6px;background:#1a1c22;color:white;border:1px solid #2a2d34;border-radius:6px;padding:6px 10px;cursor:pointer;">+</button>
<button id="starredBtn" style="margin-left:6px;background:#1a1c22;color:white;border:1px solid #2a2d34;border-radius:6px;padding:6px 10px;cursor:pointer;">⭐</button>
<button id="dashboardBtn" style="margin-left:6px;background:#1a1c22;color:white;border:1px solid #2a2d34;border-radius:6px;padding:6px 10px;cursor:pointer;">📊</button>
</header>
  <div id="dashboardPanel" style="display:none;position:absolute;top:60px;right:16px;width:360px;max-height:500px;overflow-y:auto;background:#1a1c22;border:1px solid #2a2d34;border-radius:8px;padding:16px;z-index:20;"></div>
  <div id="starredPanel" style="display:none;position:absolute;top:60px;right:16px;width:320px;max-height:400px;overflow-y:auto;background:#1a1c22;border:1px solid #2a2d34;border-radius:8px;padding:12px;z-index:20;"></div>
  <div id="pinnedBar" style="display:none;padding:10px 16px;background:#1a1c22;border-bottom:1px solid #2a2d34;font-size:0.85em;"></div>
  <div id="chat" style="display:none;"></div>
  <div id="emptyState">
    <h2>What can I help with?</h2>
    <div>
      <span class="example-chip" data-q="how do FreeRTOS queues work">FreeRTOS queues</span>
      <span class="example-chip" data-q="explain sap-1">Explain SAP-1</span>
      <span class="example-chip" data-q="hi nova">Say hi</span>
    </div>
  </div>

  <div id="inputBar">
    <input id="fileInput" type="file" accept=".pdf,.docx,.txt,.md" style="display:none;">
    <button id="attachBtn" style="padding:12px;border-radius:8px;border:1px solid #2a2d34;background:#1a1c22;color:white;cursor:pointer;">📎</button>
    <input id="messageInput" type="text" placeholder="Ask NOVA..." autocomplete="off">
    <button id="sendBtn">Send</button>
</div>
</div>

<script>
let sessionId = localStorage.getItem("nova_session_id");
if (!sessionId) {
  sessionId = "mobile-" + Math.random().toString(36).slice(2);
  localStorage.setItem("nova_session_id", sessionId);
}

const GENERAL_SESSION_ID = "general-default";
const chat = document.getElementById("chat");
const emptyState = document.getElementById("emptyState");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const sessionList = document.getElementById("sessionList");
const sidebar = document.getElementById("sidebar");
const newChatBtn = document.getElementById("newChatBtn");
const modeSelect = document.getElementById("modeSelect");
const starredPanel = document.getElementById("starredPanel");
const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");

function showChat(hasMessages) {
  chat.style.display = hasMessages ? "flex" : "none";
  emptyState.style.display = hasMessages ? "none" : "flex";
}
function attachActions(div, role, text, userMsgId, assistantMsgId, initialPinned, initialStarred) {
  const msgId = role === "user" ? userMsgId : assistantMsgId;
  if (!msgId) return;

  const actions = document.createElement("div");
  actions.style.cssText = "margin-top:6px;display:flex;gap:6px;";

  const mkBtn = (label, title, onClick) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.title = title;
    b.style.cssText = "font-size:0.75em;padding:2px 6px;border-radius:5px;border:1px solid #2a2d34;background:transparent;color:#888;cursor:pointer;";
    b.addEventListener("click", onClick);
    return b;
  };

  actions.appendChild(mkBtn("📋", "Copy", () => {
    navigator.clipboard.writeText(text);
  }));

  const pinBtn = mkBtn("📌", "Pin/unpin", async (e) => {
    const isPinned = pinBtn.dataset.active === "true";
    await fetch(isPinned ? "/messages/unpin" : "/messages/pin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message_id: msgId }),
    });
    pinBtn.dataset.active = isPinned ? "false" : "true";
    pinBtn.style.background = isPinned ? "transparent" : "#2f6feb33";
    pinBtn.style.borderColor = isPinned ? "#2a2d34" : "#2f6feb";
    loadPinned();
  });
  pinBtn.dataset.active = initialPinned ? "true" : "false";
  pinBtn.style.background = initialPinned ? "#2f6feb33" : "transparent";
  pinBtn.style.borderColor = initialPinned ? "#2f6feb" : "#2a2d34";
  actions.appendChild(pinBtn);

  const starBtn = mkBtn("⭐", "Star/unstar", async (e) => {
    const isStarred = starBtn.dataset.active === "true";
    await fetch(isStarred ? "/messages/unstar" : "/messages/star", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message_id: msgId }),
    });
    starBtn.dataset.active = isStarred ? "false" : "true";
    starBtn.style.background = isStarred ? "transparent" : "#e0c34133";
    starBtn.style.borderColor = isStarred ? "#2a2d34" : "#e0c341";
    if (starredPanel.style.display === "block") {
      loadStarred();
    }
  });
  starBtn.dataset.active = initialStarred ? "true" : "false";
  starBtn.style.background = initialStarred ? "#e0c34133" : "transparent";
  starBtn.style.borderColor = initialStarred ? "#e0c341" : "#2a2d34";
  actions.appendChild(starBtn);

  if (role === "user") {
    actions.appendChild(mkBtn("✏️", "Edit & retry", async () => {
      const newText = prompt("Edit your message:", text);
      if (!newText || newText === text) return;
      const res = await fetch("/chat/retry", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message_id: msgId, new_message: newText }),
      });
      loadHistory(sessionId);
    }));
  }

  div.appendChild(actions);
}

function addMessage(text, role, meta, userQuestion, userMsgId, assistantMsgId, initialPinned, initialStarred) {
  const div = document.createElement("div");
  div.className = "msg " + role;

  const textDiv = document.createElement("div");
  textDiv.textContent = text;
  div.appendChild(textDiv);

  const msgId = role === "user" ? userMsgId : assistantMsgId;

  if (meta) {
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    if (meta.mode) {
      const badge = document.createElement("span");
      badge.className = "mode-badge mode-" + meta.mode;
      badge.textContent = meta.mode.replace(/_/g, " ");
      metaDiv.appendChild(badge);
    }
    if (meta.sources && meta.sources.length) {
      const src = document.createElement("span");
      src.textContent = meta.sources.join(", ");
      metaDiv.appendChild(src);
    }
    div.appendChild(metaDiv);

    if (meta.filed_elsewhere) {
      const prompt = document.createElement("div");
      prompt.style.marginTop = "8px";
      const btn = document.createElement("button");
      btn.textContent = "Move to General chat";
      btn.style.cssText = "font-size:0.8em;padding:4px 10px;border-radius:6px;border:1px solid #2a2d34;background:#21242c;color:#ccc;cursor:pointer;";
      btn.addEventListener("click", async () => {
        await fetch("/sessions/move_message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            target_session_id: GENERAL_SESSION_ID,
            user_message: userQuestion,
            assistant_message: text,
            source_user_message_id: userMsgId,
            source_assistant_message_id: assistantMsgId,
          }),
        });
        switchSession(GENERAL_SESSION_ID);
        loadSessions();
      });
      prompt.appendChild(btn);
      div.appendChild(prompt);
    }
  }

  if (msgId) {
    attachActions(div, role, text, userMsgId, assistantMsgId, initialPinned, initialStarred);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  showChat(true);
}

const dashboardPanel = document.getElementById("dashboardPanel");

async function loadDashboard() {
  const res = await fetch("/knowledge/dashboard");
  const stats = await res.json();

  dashboardPanel.innerHTML = "<strong>📊 Knowledge Dashboard</strong>";

  const totalDiv = document.createElement("div");
  totalDiv.style.cssText = "font-size:1.8em;font-weight:700;margin:12px 0 4px;color:#6fdc8c;";
  totalDiv.textContent = stats.total_chunks;
  dashboardPanel.appendChild(totalDiv);

  const totalLabel = document.createElement("div");
  totalLabel.style.cssText = "font-size:0.8em;color:#888;margin-bottom:16px;";
  totalLabel.textContent = "knowledge chunks stored";
  dashboardPanel.appendChild(totalLabel);

  const confDiv = document.createElement("div");
  confDiv.style.cssText = "font-size:0.85em;color:#ccc;margin-bottom:16px;";
  confDiv.textContent = `Average confidence: ${(stats.average_confidence * 100).toFixed(0)}%`;
  dashboardPanel.appendChild(confDiv);

  const tierHeading = document.createElement("div");
  tierHeading.style.cssText = "font-weight:600;color:#6fb8dc;margin-top:10px;";
  tierHeading.textContent = "By tier";
  dashboardPanel.appendChild(tierHeading);
  for (const [tier, count] of Object.entries(stats.by_tier)) {
    const row = document.createElement("div");
    row.style.cssText = "font-size:0.82em;color:#ccc;display:flex;justify-content:space-between;padding:3px 0;";
    row.innerHTML = `<span>${tier}</span><span>${count}</span>`;
    dashboardPanel.appendChild(row);
  }

  const catHeading = document.createElement("div");
  catHeading.style.cssText = "font-weight:600;color:#6fb8dc;margin-top:12px;";
  catHeading.textContent = "By category";
  dashboardPanel.appendChild(catHeading);
  const sortedCats = Object.entries(stats.by_category).sort((a, b) => b[1] - a[1]);
  for (const [cat, count] of sortedCats) {
    const row = document.createElement("div");
    row.style.cssText = "font-size:0.82em;color:#ccc;display:flex;justify-content:space-between;padding:3px 0;";
    row.innerHTML = `<span>${cat.replace(/_/g, " ")}</span><span>${count}</span>`;
    dashboardPanel.appendChild(row);
  }

  const growthHeading = document.createElement("div");
  growthHeading.style.cssText = "font-weight:600;color:#6fb8dc;margin-top:12px;";
  growthHeading.textContent = "Growth (last 14 days)";
  dashboardPanel.appendChild(growthHeading);

  const chartDiv = document.createElement("div");
  chartDiv.style.cssText = "display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:8px;";
  const growthEntries = Object.entries(stats.growth_last_14_days);
  const maxCount = Math.max(...growthEntries.map(([, c]) => c), 1);
  for (const [day, count] of growthEntries) {
    const bar = document.createElement("div");
    const heightPct = (count / maxCount) * 100;
    bar.style.cssText = `flex:1;background:#2f6feb;border-radius:2px 2px 0 0;height:${heightPct}%;min-height:2px;`;
    bar.title = `${day}: ${count} chunks`;
    chartDiv.appendChild(bar);
  }
  dashboardPanel.appendChild(chartDiv);
}

document.getElementById("dashboardBtn").addEventListener("click", async () => {
  const isVisible = dashboardPanel.style.display === "block";
  if (isVisible) {
    dashboardPanel.style.display = "none";
  } else {
    await loadDashboard();
    dashboardPanel.style.display = "block";
  }
});

let starredData = null;

async function loadStarred() {
  const res = await fetch("/starred");
  starredData = (await res.json()).starred_by_mode;
  renderStarredPanel();
}

function renderStarredPanel() {
  starredPanel.innerHTML = "";

  const header = document.createElement("div");
  header.innerHTML = "<strong>⭐ Starred messages</strong>";
  starredPanel.appendChild(header);

  const modes = Object.keys(starredData);
  if (!modes.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "color:#666;margin-top:10px;";
    empty.textContent = "Nothing starred yet.";
    starredPanel.appendChild(empty);
    return;
  }

  const filterSelect = document.createElement("select");
  filterSelect.style.cssText = "margin-top:10px;width:100%;background:#0f1115;color:white;border:1px solid #2a2d34;border-radius:6px;padding:6px;";
  const allOpt = document.createElement("option");
  allOpt.value = "__all__";
  allOpt.textContent = "All modes";
  filterSelect.appendChild(allOpt);
  for (const mode of modes) {
    const opt = document.createElement("option");
    opt.value = mode;
    opt.textContent = mode === "general" ? "General" : mode.replace(/_/g, " ");
    filterSelect.appendChild(opt);
  }
  filterSelect.addEventListener("change", () => renderStarredResults(filterSelect.value));
  starredPanel.appendChild(filterSelect);

  const resultsDiv = document.createElement("div");
  resultsDiv.id = "starredResults";
  resultsDiv.style.marginTop = "10px";
  starredPanel.appendChild(resultsDiv);

  renderStarredResults("__all__");
}

function renderStarredResults(filterMode) {
  const resultsDiv = document.getElementById("starredResults");
  resultsDiv.innerHTML = "";

  const modesToShow = filterMode === "__all__" ? Object.keys(starredData) : [filterMode];

  for (const mode of modesToShow) {
    const heading = document.createElement("div");
    heading.style.cssText = "font-weight:600;margin-top:10px;color:#6fb8dc;";
    heading.textContent = mode === "general" ? "General" : mode.replace(/_/g, " ");
    resultsDiv.appendChild(heading);

    for (const msg of starredData[mode]) {
      const item = document.createElement("div");
      item.style.cssText = "font-size:0.85em;color:#ccc;padding:6px 0;border-bottom:1px solid #2a2d34;cursor:pointer;";
      item.textContent = msg.content.slice(0, 80) + (msg.content.length > 80 ? "..." : "");
      item.addEventListener("click", () => {
        switchSession(msg.session_id);
        starredPanel.style.display = "none";
      });
      resultsDiv.appendChild(item);
    }
  }
}

async function sendMessage(text) {
  text = (text || input.value).trim();
  if (!text) return;

  addMessage(text, "user");
  const userDiv = chat.lastElementChild;
  input.value = "";
  sendBtn.disabled = true;

  const assistantDiv = document.createElement("div");
  assistantDiv.className = "msg assistant";
  const assistantTextDiv = document.createElement("div");
  assistantTextDiv.textContent = "thinking...";
  assistantTextDiv.style.opacity = "0.6";
  assistantDiv.appendChild(assistantTextDiv);
  chat.appendChild(assistantDiv);
  chat.scrollTop = chat.scrollHeight;
  showChat(true);

  let fullText = "";

  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === "chunk") {
          if (fullText === "") {
            assistantTextDiv.style.opacity = "1";
          }
          fullText += event.text;
          assistantTextDiv.textContent = fullText;
          chat.scrollTop = chat.scrollHeight;
        } else if (event.type === "done") {
          attachActions(userDiv, "user", text, event.user_message_id, event.user_message_id);

          const metaDiv = document.createElement("div");
          metaDiv.className = "meta";
          const badge = document.createElement("span");
          badge.className = "mode-badge mode-" + event.mode;
          badge.textContent = event.mode.replace(/_/g, " ");
          metaDiv.appendChild(badge);
          if (event.sources && event.sources.length) {
            const src = document.createElement("span");
            src.textContent = event.sources.join(", ");
            metaDiv.appendChild(src);
          }
          assistantDiv.appendChild(metaDiv);

          if (event.filed_elsewhere) {
            const moveBtn = document.createElement("button");
            moveBtn.textContent = "Move to General chat";
            moveBtn.style.cssText = "margin-top:8px;font-size:0.8em;padding:4px 10px;border-radius:6px;border:1px solid #2a2d34;background:#21242c;color:#ccc;cursor:pointer;display:block;";
            moveBtn.addEventListener("click", async () => {
              await fetch("/sessions/move_message", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  target_session_id: GENERAL_SESSION_ID,
                  user_message: text, assistant_message: fullText,
                  source_user_message_id: event.user_message_id,
                  source_assistant_message_id: event.assistant_message_id,
                }),
              });
              switchSession(GENERAL_SESSION_ID);
              loadSessions();
            });
            assistantDiv.appendChild(moveBtn);
          }

          attachActions(assistantDiv, "assistant", fullText, event.user_message_id, event.assistant_message_id);
          loadSessions();
        }
      }
    }
  } catch (err) {
    assistantTextDiv.textContent = "Error: could not reach NOVA. " + err;
  } finally {
    sendBtn.disabled = false;
  }
}

const pinnedBar = document.getElementById("pinnedBar");

async function loadPinned() {
  try {
    const res = await fetch("/sessions/" + sessionId + "/pinned");
    const data = await res.json();
    if (!data.pinned.length) {
      pinnedBar.style.display = "none";
      return;
    }
    pinnedBar.innerHTML = "<strong>📌 Pinned:</strong> ";
    data.pinned.forEach((m, i) => {
      const span = document.createElement("span");
      span.textContent = m.content.slice(0, 60) + (m.content.length > 60 ? "..." : "");
      span.style.cssText = "color:#aaa;margin-right:10px;";
      pinnedBar.appendChild(span);
    });
    pinnedBar.style.display = "block";
  } catch (err) {
    pinnedBar.style.display = "none";
  }
}

async function loadHistory(id) {
  chat.innerHTML = "";
  try {
    const res = await fetch("/history/" + id);
    if (!res.ok) { showChat(false); return; }
    const data = await res.json();
    if (!data.messages.length) { showChat(false); return; }
    for (const msg of data.messages) {
      const id = msg.role === "user" ? msg.id : undefined;
      const assistantId = msg.role === "assistant" ? msg.id : undefined;
      addMessage(msg.content, msg.role, null, null, id, assistantId, !!msg.pinned, !!msg.starred);
    }
  } catch (err) {
    showChat(false);
  }
}

let showArchived = false;

async function loadSessions() {
  try {
    const url = showArchived ? "/sessions?include_archived=true" : "/sessions";
    const res = await fetch(url);
    const data = await res.json();
    sessionList.innerHTML = "";

    const visibleSessions = showArchived
      ? data.sessions.filter(s => s.archived)
      : data.sessions.filter(s => !s.archived);

    for (const s of visibleSessions) {
      const item = document.createElement("div");
      item.className = "session-item" + (s.session_id === sessionId ? " active" : "");

      const title = document.createElement("div");
      title.className = "session-title";
      title.textContent = s.title;
      title.addEventListener("click", () => switchSession(s.session_id));

      const archiveBtn = document.createElement("span");
      archiveBtn.className = "session-delete";
      archiveBtn.textContent = s.archived ? "↩" : "🗄";
      archiveBtn.title = s.archived ? "Unarchive" : "Archive";
      archiveBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/sessions/" + s.session_id + "/archive", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ archived: !s.archived }),
        });
        if (s.session_id === sessionId && !s.archived) startNewChat();
        loadSessions();
      });

      const del = document.createElement("span");
      del.className = "session-delete";
      del.textContent = "✕";
      del.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/sessions/" + s.session_id, { method: "DELETE" });
        if (s.session_id === sessionId) startNewChat();
        loadSessions();
      });

      item.appendChild(title);
      item.appendChild(archiveBtn);
      item.appendChild(del);
      sessionList.appendChild(item);
    }
  } catch (err) {
    console.error("Could not load sessions:", err);
  }
}

document.getElementById("archivedToggle").addEventListener("click", () => {
  showArchived = !showArchived;
  document.getElementById("archivedToggle").textContent = showArchived ? "Show active" : "Show archived";
  loadSessions();
});

async function loadModes() {
  const res = await fetch("/modes");
  const data = await res.json();
  modeSelect.innerHTML = "";
  for (const m of data.modes) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m === "general" ? "General" : m.replace(/_/g, " ");
    modeSelect.appendChild(opt);
  }
  syncModeSelect();
}

async function syncModeSelect() {
  const res = await fetch("/sessions");
  const data = await res.json();
  const current = data.sessions.find(s => s.session_id === sessionId);
  console.log("syncModeSelect: sessionId=", sessionId, "found session=", current);
  modeSelect.value = current ? current.mode : "general";
}

modeSelect.addEventListener("change", async () => {
  await fetch("/sessions/" + sessionId + "/mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: modeSelect.value }),
  });
  loadSessions();
});

document.getElementById("newModeBtn").addEventListener("click", async () => {
  const name = prompt("Name this mode (e.g. 'cooking', 'personal_finance'):");
  if (!name) return;
  const normalized = name.trim().toLowerCase().replace(/\s+/g, "_");
  if (!normalized) return;

  await fetch("/sessions/" + sessionId + "/mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: normalized }),
  });
  await loadModes();
  modeSelect.value = normalized;
  loadSessions();
});

function switchSession(id) {
  sessionId = id;
  localStorage.setItem("nova_session_id", sessionId);
  loadHistory(sessionId);
  loadSessions();
  syncModeSelect();
  loadPinned();
}

function startNewChat() {
  sessionId = "mobile-" + Math.random().toString(36).slice(2);
  localStorage.setItem("nova_session_id", sessionId);
  chat.innerHTML = "";
  showChat(false);
  syncModeSelect();
  loadSessions();
}

attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  addMessage(`📎 Uploading "${file.name}"...`, "user");

  const formData = new FormData();
  formData.append("file", file);
  formData.append("tags", "chat-upload");
  formData.append("confidence", "1.0");

  const currentModeRes = await fetch("/sessions");
  const sessionsData = await currentModeRes.json();
  const current = sessionsData.sessions.find(s => s.session_id === sessionId);
  const mode = current ? current.mode : "general";
  formData.append("categories", mode);

  try {
    const res = await fetch("/knowledge/ingest_document", {
      method: "POST",
      body: formData,
    });
    const data = await res.json();
    addMessage(
      `"${file.name}" processed: ${data.chunks_stored} chunks stored` +
      (data.chunks_skipped_as_duplicate ? `, ${data.chunks_skipped_as_duplicate} skipped as duplicate` : "") +
      `. Ask me anything about it!`,
      "assistant"
    );
  } catch (err) {
    addMessage("Error uploading file: " + err, "assistant");
  }

  fileInput.value = "";
});

newChatBtn.addEventListener("click", startNewChat);
sendBtn.addEventListener("click", () => sendMessage());
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
document.getElementById("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("collapsed"));

newChatBtn.addEventListener("click", startNewChat);
sendBtn.addEventListener("click", () => sendMessage());
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
document.getElementById("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("collapsed"));
document.querySelectorAll(".example-chip").forEach(chip => {
  chip.addEventListener("click", () => sendMessage(chip.dataset.q));
});

document.getElementById("starredBtn").addEventListener("click", async () => {
  const isVisible = starredPanel.style.display === "block";
  if (isVisible) {
    starredPanel.style.display = "none";
  } else {
    await loadStarred();
    starredPanel.style.display = "block";
  }
});

async function init() {
  await loadModes();
  await loadHistory(sessionId);
  await loadSessions();
  await loadPinned();
}
init();
</script>
