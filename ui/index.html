<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    font-size: 1.2em;
    font-weight: bold;
    border-bottom: 1px solid #2a2d34;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2f6feb; color: white; }
  .assistant { align-self: flex-start; background: #1e2128; }
  .meta { font-size: 0.75em; opacity: 0.6; margin-top: 4px; }
  #inputBar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #2a2d34;
    gap: 8px;
  }
  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: white;
    font-size: 1em;
  }
  #sendBtn {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2f6feb;
    color: white;
    font-size: 1em;
  }
</style>
</head>
<body>

<header>NOVA</header>
<div id="chat"></div>

<div id="inputBar">
  <input id="messageInput" type="text" placeholder="Ask NOVA..." autocomplete="off">
  <button id="sendBtn">Send</button>
</div>

<script>
const sessionId = "mobile-" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, role, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (meta) {
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    metaDiv.textContent = meta;
    div.appendChild(metaDiv);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;

  const thinkingDiv = document.createElement("div");
  thinkingDiv.className = "msg assistant";
  thinkingDiv.textContent = "...";
  chat.appendChild(thinkingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    thinkingDiv.remove();
    const meta = data.mode + (data.sources.length ? " · " + data.sources.join(", ") : "");
    addMessage(data.answer, "assistant", meta);
  } catch (err) {
    thinkingDiv.remove();
    addMessage("Error: could not reach NOVA. " + err, "assistant");
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
