<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: #16181d;
    border-right: 1px solid #2a2d34;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed { margin-left: -260px; }
  #newChatBtn {
    margin: 12px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: white;
    font-size: 0.95em;
    cursor: pointer;
    text-align: left;
  }
  #newChatBtn:hover { background: #21242c; }
  #sessionList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    color: #ccc;
    margin-bottom: 2px;
  }
  .session-item:hover { background: #1e2128; }
  .session-item.active { background: #2a3550; color: white; }
  .session-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-delete {
    opacity: 0;
    color: #888;
    font-size: 1.1em;
    padding: 2px 6px;
  }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: #ff6b6b; }

  /* Main chat area */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    padding: 14px 16px;
    font-size: 1.1em;
    font-weight: bold;
    border-bottom: 1px solid #2a2d34;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #sidebarToggle {
    background: none;
    border: 1px solid #2a2d34;
    color: #ccc;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #666;
    text-align: center;
    padding: 20px;
  }
  #emptyState h2 { color: #999; margin-bottom: 8px; }
  .example-chip {
    background: #1a1c22;
    border: 1px solid #2a2d34;
    border-radius: 20px;
    padding: 8px 16px;
    margin: 6px;
    display: inline-block;
    cursor: pointer;
    font-size: 0.85em;
    color: #aaa;
  }
  .example-chip:hover { background: #21242c; }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2f6feb; color: white; }
  .assistant { align-self: flex-start; background: #1e2128; }
  .meta {
    font-size: 0.72em;
    opacity: 0.65;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mode-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85em;
  }
  .mode-high_confidence, .mode-broad_confidence { background: #1f4d2e; color: #6fdc8c; }
  .mode-low_confidence { background: #4d3f1f; color: #dcb96f; }
  .mode-no_local_answer { background: #4d1f1f; color: #dc6f6f; }
  .mode-learned_from_internet { background: #1f3d4d; color: #6fb8dc; }
  .mode-casual { background: #2a2d34; color: #999; }

  #inputBar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #2a2d34;
    gap: 8px;
  }
  #messageInput {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: white;
    font-size: 1em;
  }
  #sendBtn {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2f6feb;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; }

  @media (max-width: 700px) {
    #sidebar { position: absolute; z-index: 10; height: 100%; }
    #sidebar:not(.collapsed) { margin-left: 0; }
    #sidebar.collapsed { margin-left: -260px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <button id="newChatBtn">+ New chat</button>
  <div id="sessionList"></div>
</div>

<div id="main">
  <header>
    <button id="sidebarToggle">☰</button>
    NOVA
  </header>

  <div id="chat" style="display:none;"></div>
  <div id="emptyState">
    <h2>What can I help with?</h2>
    <div>
      <span class="example-chip" data-q="how do FreeRTOS queues work">FreeRTOS queues</span>
      <span class="example-chip" data-q="explain sap-1">Explain SAP-1</span>
      <span class="example-chip" data-q="hi nova">Say hi</span>
    </div>
  </div>

  <div id="inputBar">
    <input id="messageInput" type="text" placeholder="Ask NOVA..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
let sessionId = localStorage.getItem("nova_session_id");
if (!sessionId) {
  sessionId = "mobile-" + Math.random().toString(36).slice(2);
  localStorage.setItem("nova_session_id", sessionId);
}

const GENERAL_SESSION_ID = "general-default";
const chat = document.getElementById("chat");
const emptyState = document.getElementById("emptyState");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const sessionList = document.getElementById("sessionList");
const sidebar = document.getElementById("sidebar");
const newChatBtn = document.getElementById("newChatBtn");

function showChat(hasMessages) {
  chat.style.display = hasMessages ? "flex" : "none";
  emptyState.style.display = hasMessages ? "none" : "flex";
}

function addMessage(text, role, meta, userQuestion) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (meta) {
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    if (meta.mode) {
      const badge = document.createElement("span");
      badge.className = "mode-badge mode-" + meta.mode;
      badge.textContent = meta.mode.replace(/_/g, " ");
      metaDiv.appendChild(badge);
    }
    if (meta.sources && meta.sources.length) {
      const src = document.createElement("span");
      src.textContent = meta.sources.join(", ");
      metaDiv.appendChild(src);
    }
    div.appendChild(metaDiv);

    if (meta.filed_elsewhere) {
      const prompt = document.createElement("div");
      prompt.style.marginTop = "8px";
      const btn = document.createElement("button");
      btn.textContent = "Move to General chat";
      btn.style.cssText = "font-size:0.8em;padding:4px 10px;border-radius:6px;border:1px solid #2a2d34;background:#21242c;color:#ccc;cursor:pointer;";
      btn.addEventListener("click", async () => {
        await fetch("/sessions/move_message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            target_session_id: GENERAL_SESSION_ID,
            user_message: userQuestion,
            assistant_message: text,
          }),
        });
        switchSession(GENERAL_SESSION_ID);
        loadSessions();
      });
      prompt.appendChild(btn);
      div.appendChild(prompt);
    }
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  showChat(true);
}

async function sendMessage(text) {
  text = (text || input.value).trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;

  const thinkingDiv = document.createElement("div");
  thinkingDiv.className = "msg assistant";
  thinkingDiv.textContent = "thinking...";
  chat.appendChild(thinkingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    thinkingDiv.remove();
    addMessage(data.answer, "assistant", { mode: data.mode, sources: data.sources, filed_elsewhere: data.filed_elsewhere }, text);
    loadSessions();
  } catch (err) {
    thinkingDiv.remove();
    addMessage("Error: could not reach NOVA. " + err, "assistant");
  } finally {
    sendBtn.disabled = false;
  }
}

async function loadHistory(id) {
  chat.innerHTML = "";
  try {
    const res = await fetch("/history/" + id);
    if (!res.ok) { showChat(false); return; }
    const data = await res.json();
    if (!data.messages.length) { showChat(false); return; }
    for (const msg of data.messages) {
      addMessage(msg.content, msg.role);
    }
  } catch (err) {
    showChat(false);
  }
}

async function loadSessions() {
  try {
    const res = await fetch("/sessions");
    const data = await res.json();
    sessionList.innerHTML = "";
    for (const s of data.sessions) {
      const item = document.createElement("div");
      item.className = "session-item" + (s.session_id === sessionId ? " active" : "");

      const title = document.createElement("div");
      title.className = "session-title";
      title.textContent = s.title;
      title.addEventListener("click", () => switchSession(s.session_id));

      const del = document.createElement("span");
      del.className = "session-delete";
      del.textContent = "✕";
      del.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch("/sessions/" + s.session_id, { method: "DELETE" });
        if (s.session_id === sessionId) startNewChat();
        loadSessions();
      });

      item.appendChild(title);
      item.appendChild(del);
      sessionList.appendChild(item);
    }
  } catch (err) {
    console.error("Could not load sessions:", err);
  }
}

function switchSession(id) {
  sessionId = id;
  localStorage.setItem("nova_session_id", sessionId);
  loadHistory(sessionId);
  loadSessions();
}

function startNewChat() {
  sessionId = "mobile-" + Math.random().toString(36).slice(2);
  localStorage.setItem("nova_session_id", sessionId);
  chat.innerHTML = "";
  showChat(false);
  loadSessions();
}

newChatBtn.addEventListener("click", startNewChat);
sendBtn.addEventListener("click", () => sendMessage());
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
document.getElementById("sidebarToggle").addEventListener("click", () => sidebar.classList.toggle("collapsed"));
document.querySelectorAll(".example-chip").forEach(chip => {
  chip.addEventListener("click", () => sendMessage(chip.dataset.q));
});

loadHistory(sessionId);
loadSessions();
</script>

</body>
</html>
